name: Build and publish to GitHub Pages

on:
    push:
        branches: ["*"]
    pull_request:
        branches: ["main"]

env:
    ASPNETCORE_ENVIRONMENT: Production
    WEBAPP_PATH: ./src/devSite/
    WEBAPP_CSPROJ: devSite.csproj
    OUTPUT_PATH: .artifacts/dist/

permissions:
    contents: read
    pages: write
    id-token: write

# Allow only one concurrent deployment
concurrency:
    group: "pages"
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Install .NET
              uses: actions/setup-dotnet@v4
              with:
                  global-json-file: global.json

            - name: Run webapp and generate static files
              env:
                  DOTNET_CLI_TELEMETRY_OPTOUT: true
              run: |
                  dotnet build
                  dotnet run --project ${{ env.WEBAPP_PATH }}${{env.WEBAPP_CSPROJ}} --configuration Release -- build "/dev-site/" "../../${{ env.OUTPUT_PATH }}"

            - name: Setup Pages
              uses: actions/configure-pages@v4

            - name: Add .nojekyll file
              run: touch ${{ env.OUTPUT_PATH }}.nojekyll

            - name: Upload artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  path: ${{ env.OUTPUT_PATH }}

    deploy:
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        runs-on: ubuntu-latest
        needs: build
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true)
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
